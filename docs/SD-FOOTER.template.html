<script>
// ENV SD — replace the old env.js and standalone brand script with this block.
(() => {
  const pilot = ['/home-sd', '/work-v2'].includes(location.pathname.replace(/\/$/, ''));
  if (pilot) {
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'https://cdn.jsdelivr.net/gh/laurent-sketch/env-motion-engine@COMMIT_SHA/dist/sd-navigation.js';
    document.body.append(script);
  } else {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/gh/laurent-sketch/env-motion-engine@4b1460fb52e8ffa3a0e179734027d4cd40c4df97/dist/env.js';
    document.body.append(script);

(() => {
  const brand = document.querySelector('.navbar-brand-three');
  const hero = document.querySelector('.hero-wrapper');
  const text = brand?.querySelector('.nav-link-sd');
  const logo = brand?.querySelector('.logo-nav');
  if (!hero || !text || !logo) return;

  let state;
  let animations = [];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  function update(force = false) {
    const showLogo = hero.getBoundingClientRect().bottom <= 0;
    document.querySelector('.navbar-logo-center')
  ?.classList.toggle('is-past-hero', showLogo);
    if (!force && showLogo === state) return;

    const initial = state === undefined;
    state = showLogo;

    const elements = [text, logo];
    const starts = elements.map(el => ({
      transform: getComputedStyle(el).transform,
      opacity: getComputedStyle(el).opacity
    }));

    animations.forEach(animation => animation.cancel());

    // Mesure leurs positions d’origine, sans transformation.
    const saved = elements.map(el => el.style.transform);
    elements.forEach(el => el.style.transform = 'none');

    const textRect = text.getBoundingClientRect();
    const logoRect = logo.getBoundingClientRect();
    const alignX = textRect.left - logoRect.left;
    const alignY =
      textRect.top + textRect.height / 2 -
      logoRect.top - logoRect.height / 2;

    elements.forEach((el, i) => {
      el.style.transform = saved[i];
    });

    const targets = [
      {
        transform: `translateY(${showLogo ? -textRect.height * 1.2 : 0}px)`,
        opacity: showLogo ? 0 : 1
      },
      {
        transform: `translate(${alignX}px, ${
          alignY + (showLogo ? 0 : textRect.height * 1.2)
        }px)`,
        opacity: showLogo ? 1 : 0
      }
    ];

    animations = elements.map((el, i) =>
      el.animate([starts[i], targets[i]], {
        duration: initial || reduced.matches ? 0 : 550,
        easing: 'cubic-bezier(.22, 1, .36, 1)',
        fill: 'forwards'
      })
    );
  }

  let pending = false;
  addEventListener('scroll', () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      update();
    });
  }, { passive: true });

  addEventListener('resize', () => update(true));
  addEventListener('pageshow', () => update(true));
  logo.addEventListener('load', () => update(true));
  document.fonts?.ready.then(() => update(true));
  update();
})();

  }
})();
</script>
